name: BuiltIn
options:
  bundleIdPrefix: com.builtin
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: 5.9.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 7.12.0

targets:
  BuiltIn:
    type: application
    platform: iOS
    sources:
      - path: BuiltIn
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.builtin.app
        INFOPLIST_FILE: BuiltIn/Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: Alamofire
      - package: Kingfisher
    info:
      path: BuiltIn/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - he
          - ar
          - ru
          - zh-Hans
        NSCameraUsageDescription: "Required to photograph items for upload."
        NSPhotoLibraryUsageDescription: "Required to attach photos to items."
        NSLocationWhenInUseUsageDescription: "Required to set a delivery drop-off location."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Required to broadcast your live GPS position during an active delivery."
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
